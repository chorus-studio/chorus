  <text font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#b3b3b3">
    <tspan x="80" y="372">Loop the chorus forever, change speed, pitch and key, shape the sound</tspan>
    <tspan x="80" y="398">with EQ and reverb, and auto-skip the tracks you never want to hear again.</tspan>
  </text>
