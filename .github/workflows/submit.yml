name: Submit to Extension Stores
on:
    workflow_dispatch:
        inputs:
            dryRun:
                default: false
                type: boolean
                description: Skip submission and perform a dry run
            bump:
                default: true
                type: boolean
                description: Bump the version, then commit, tag and create the GitHub release (off = resubmit the version already in package.json)
            chrome:
                default: true
                type: boolean
                description: Submit to the Chrome Web Store
            firefox:
                default: true
                type: boolean
                description: Submit to Firefox Add-ons

jobs:
    validate:
        name: Validate
        uses: ./.github/workflows/validate.yml
        secrets: inherit

    submit:
        name: Submit
        runs-on: ubuntu-22.04
        needs: [validate]
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2

            - name: Configure Git
              run: |
                  git config user.email "github-actions@users.noreply.github.com"
                  git config user.name "GitHub Actions"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Bump Version
              id: version
              run: |
                  if [ "${{ inputs.bump }}" = "true" ]; then
                      LAST_STABLE=$(git tag --list 'v*' --sort=-version:refname | grep -v beta | head -1)
                      bunx changelogen@latest --bump --from "$LAST_STABLE"
                  fi
                  NEW_VERSION=$(bun --print 'require("./package.json").version')
                  echo "newVersion=$NEW_VERSION" >> "$GITHUB_OUTPUT"

            - name: Build and Zip
              id: build
              run: |
                  bun run zip
                  bun run zip:fox

            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  path: .output/*.zip
                  if-no-files-found: error
                  include-hidden-files: true

            # Uploads, waits for the store to finish processing the ~80MB zip, then publishes.
            # `wxt submit` publishes immediately after upload and fails on large packages.
            - name: Submit to Chrome Web Store
              if: ${{ inputs.chrome }}
              run: node scripts/cws-publish.mjs .output/*-chrome.zip
              env:
                  DRY_RUN: ${{ inputs.dryRun }}
                  CHROME_EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
                  CHROME_CLIENT_ID: ${{ secrets.CLIENT_ID }}
                  CHROME_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
                  CHROME_REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}

            # Runs even when the Chrome submit failed so one store cannot block the other.
            - name: Submit to Firefox Add-ons
              if: ${{ inputs.firefox && !cancelled() && steps.build.outcome == 'success' }}
              run: |
                  bun wxt submit \
                    --firefox-zip .output/*-firefox.zip --firefox-sources-zip .output/*-sources.zip
              env:
                  DRY_RUN: ${{ inputs.dryRun }}
                  FIREFOX_EXTENSION_ID: ${{ secrets.AMO_ID }}
                  FIREFOX_JWT_ISSUER: ${{ secrets.AMO_ISSUER }}
                  FIREFOX_JWT_SECRET: ${{ secrets.AMO_SECRET }}
                  # EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
                  # EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
                  # EDGE_CLIENT_SECRET: ${{ secrets.EDGE_CLIENT_SECRET }}
                  # EDGE_ACCESS_TOKEN_URL: ${{ secrets.EDGE_ACCESS_TOKEN_URL }}

            - name: Commit and Push
              if: ${{ !inputs.dryRun && inputs.bump }}
              run: |
                  git add package.json CHANGELOG.md
                  git commit -am "chore(release): v$NEW_VERSION"
                  git tag v$NEW_VERSION
                  git push
                  git push --tags
              env:
                  NEW_VERSION: ${{ steps.version.outputs.newVersion }}

            - name: Release
              if: ${{ !inputs.dryRun && inputs.bump }}
              run: npx changelogen@latest gh release ${{ steps.version.outputs.newVersion }} --token ${{ github.token }}

            # Don't upload sources zip - it can contain .env files, which may include secrets
            - name: Upload ZIPs
              if: ${{ !inputs.dryRun && inputs.bump }}
              run: gh release upload v${{ steps.version.outputs.newVersion }} .output/*-chrome.zip .output/*-firefox.zip
              env:
                  GITHUB_TOKEN: ${{ github.token }}
